ont-weight="400">Apartarías $1,000 al mes</text><rect x="838" y="817" width="308" height="51" rx="12" fill="#1B4FD8" stroke="none"/><text x="856" y="849" font-family="DejaVu Sans" font-size="15" fill="#FFFFFF" font-weight="700">Revisar mi meta</text><text x="816" y="927" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">Pocos campos y vista previa viva.</text><text x="816" y="949" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">Guardar después de revisar; mostrar</text><text x="816" y="971" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">errores junto al campo.</text><text x="1200" y="168" font-family="DejaVu Sans" font-size="20" fill="#0F172A" font-weight="700">H / Tutorial</text><rect x="1200" y="190" width="352" height="702" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1222" y="226" font-family="DejaVu Sans" font-size="27" fill="#0F172A" font-weight="400">‹</text><text x="1248" y="224" font-family="DejaVu Sans" font-size="12" fill="#475569" font-weight="600">PRESUPUESTO · L04</text><text x="1509" y="224" font-family="DejaVu Sans" font-size="18" fill="#1B4FD8" font-weight="700">?</text><rect x="1222" y="244" width="308" height="5" rx="2" fill="#E2E8F0" stroke="none"/><rect x="1222" y="244" width="145" height="5" rx="2" fill="#F59E0B" stroke="none"/><text x="1222" y="275" font-family="DejaVu Sans" font-size="12" fill="#475569" font-weight="400">Practica · Paso 1 de 3</text><text x="1222" y="313" font-family="DejaVu Sans" font-size="22" fill="#0F172A" font-weight="700">Registra tu primer</text><text x="1222" y="342" font-family="DejaVu Sans" font-size="22" fill="#0F172A" font-weight="700">movimiento</text><rect x="1222" y="400" width="308" height="40" rx="12" fill="#FEF3C7" stroke="none"/><text x="1236" y="427" font-family="DejaVu Sans" font-size="13" fill="#92400E" font-weight="700">MODO DE ENSAYO</text><text x="1222" y="479" font-family="DejaVu Sans" font-size="16" fill="#0F172A" font