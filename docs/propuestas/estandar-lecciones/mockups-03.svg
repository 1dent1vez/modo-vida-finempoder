440" r="26" fill="#1B4FD8"/><text x="218" y="447" font-family="DejaVu Sans" font-size="18" fill="#FFFFFF" font-weight="700">2</text><text x="203" y="489" font-family="DejaVu Sans" font-size="14" fill="#0F172A" font-weight="400">Hoy</text><circle cx="330" cy="440" r="26" fill="#E2E8F0"/><text x="324" y="447" font-family="DejaVu Sans" font-size="18" fill="#475569" font-weight="700">3</text><text x="309" y="489" font-family="DejaVu Sans" font-size="14" fill="#0F172A" font-weight="400">Día 3</text><text x="70" y="546" font-family="DejaVu Sans" font-size="18" fill="#0F172A" font-weight="700">¿Cuánto apartaste hoy?</text><rect x="70" y="569" width="308" height="60" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="86" y="609" font-family="DejaVu Sans" font-size="27" fill="#0F172A" font-weight="400">$50</text><rect x="70" y="662" width="308" height="108" rx="12" fill="#D1FAE5" stroke="none"/><text x="86" y="697" font-family="DejaVu Sans" font-size="14" fill="#475569" font-weight="400">Lo que llevas</text><text x="86" y="731" font-family="DejaVu Sans" font-size="24" fill="#0F172A" font-weight="700">$30 registrados</text><text x="86" y="755" font-family="DejaVu Sans" font-size="12" fill="#475569" font-weight="400">Hoy se suma al confirmar</text><rect x="70" y="817" width="308" height="51" rx="12" fill="#1B4FD8" stroke="none"/><text x="88" y="849" font-family="DejaVu Sans" font-size="15" fill="#FFFFFF" font-weight="700">Registrar mi ahorro</text><text x="48" y="927" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">Fechas y registros reales. Volver</text><text x="48" y="949" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">después conserva avances y evita</text><text x="48" y="971" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">registros duplicados.</text><text x="432" y="168" font-family="DejaVu Sans" font-size="20" fill="#0F172A" font-weight="700">J / Finni revisa</text><rect x="432" y="190" width="352" height="702" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/><text x="454" y="226" font-family="DejaVu Sans" font-size="27" fill="#0F172A" font-weight="400">‹</text><text x="480" y="224" font-family="DejaVu Sans" font-size="12" fill="#475569" font-weight="600">AHORRO · L13</text><text x="741" y="224" font-family="DejaVu Sans" font-size="18" fill="#1B4FD8" font-weight="700">?</text><rect x="454" y="244" width="308" height="5" rx="2" fill="#E2E8F0" stroke="none"/><rect x="454" y="244" width="145" height="5" rx="2" fill="#10B981" stroke="none"/><text x="454" y="275" font-family="DejaVu Sans" font-size="12" fill="#475569" font-weight="400">Reflexiona · Con tus registros</text><text x="454" y="313" font-family="DejaVu Sans" font-size="22" fill="#0F172A" font-weight="700">Tu siguiente paso puede</text><text x="454" y="342" font-family="DejaVu Sans" font-size="22" fill="#0F172A" font-weight="700">ser pequeño</text><rect x="454" y="404" width="308" height="126" rx="12" fill="#EEF2FF" stroke="none"/><text x="470" y="439" font-family="DejaVu Sans" font-size="12" fill="#1B4FD8" font-weight="700">FINNI OBSERVA</text><text x="470" y="471" font-family="DejaVu Sans" font-size="21" fill="#0F172A" font-weight="700">Ya registraste ahorro en</text><text x="470" y="499" font-family="DejaVu Sans" font-size="21" fill="#0F172A" font-weight="700">dos días.</text><text x="454" y="572" font-family="DejaVu Sans" font-size="13" fill="#475569" font-weight="400">Basado en tu reto de ahorro</text><text x="454" y="626" font-family="DejaVu Sans" font-size="17" fill="#0F172A" font-weight="700">¿Qué te ayudaría a seguir?</text><rect x="454" y="651" width="308" height="53" rx="10" fill="#EEF2FF" stroke="#1B4FD8"/><circle cx="474" cy="677" r="7" fill="#1B4FD8"/><text x="492" y="683" font-family="DejaVu Sans" font-size="14" fill="#0F172A" font-weight="600">Elegir un monto más pequeño</text><rect x="454" y="716" width="308" height="53" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/><circle cx="474" cy="742" r="7" fill="#CBD5E1"/><text x="492" y="748" font-family="DejaVu Sans" font-size="14" fill="#0F172A" font-weight="400">Cambiar el momento del día</text><rect x="454" y="817" width="308" height="51" rx="12" fill="#1B4FD8" stroke="none"/><text x="472" y="849" font-family="DejaVu Sans" font-size="15" fill="#FFFFFF" font-weight="700">Elegir mi ajuste</text><text x="432" y="927" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">Un hallazgo y una acción concreta.</text><text x="432" y="949" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">Si faltan datos, mostrarlo sin</text><text x="432" y="971" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">inventar un diagnóstico.</text><text x="816" y="168" font-family="DejaVu Sans" font-size="20" fill="#0F172A" font-weight="700">K / Misión final</text><rect x="816" y="190" width="352" height="702" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/><text x="838" y="226" font-family="DejaVu Sans" font-size="27" fill="#0F172A" font-weight="400">‹</text><text x="864" y="224" font-family="DejaVu Sans" font-size="12" fill="#475569" font-weight="600">INVERSIÓN · L15</text><text x="1125" y="224" font-family="DejaVu Sans" font-size="18" fill="#1B4FD8" font-weight="700">?</text><rect x="838" y="244" width="308" height="5" rx="2" fill="#E2E8F0" stroke="none"/><rect x="838" y="244" width="145" height="5" rx="2" fill="#1B4FD8" stroke="none"/><text x="838" y="275" font-family="DejaVu Sans" font-size="12" fill="#475569" font-weight="400">Integra · Simulación</text><text x="838" y="313" font-family="DejaVu Sans" font-size="22" fill="#0F172A" font-weight="700">Pon a prueba tu plan</text><rect x="838" y="404" width="308" height="103" rx="12" fill="#EEF2FF" stroke="none"/><text x="854" y="436" font-family="DejaVu Sans" font-size="12" fill="#1B4FD8" font-weight="700">CAPITAL SIMULADO</text><text x="854" y="477" font-family="DejaVu Sans" font-size="34" fill="#0F172A" font-weight="700">$5,000</text><circle cx="854" cy="547" r="14" fill="#1B4FD8"/><text x="849" y="552" font-family="DejaVu Sans" font-size="14" fill="#FFFFFF" font-weight="400">1</text><text x="879" y="552" font-family="DejaVu Sans" font-size="14" fill="#0F172A" font-weight="600">Revisar tu distribución</text><circle cx="854" cy="618" r="14" fill="#E2E8F0"/><text x="849" y="623" font-family="DejaVu Sans" font-size="14" fill="#0F172A" font-weight="400">2</text><text x="879" y="623" font-family="DejaVu Sans" font-size="14" fill="#0F172A" font-weight="600">Responder a un imprevisto</text><circle cx="854" cy="689" r="14" fill="#E2E8F0"/><text x="849" y="694" font-family="DejaVu Sans" font-size="14" fill="#0F172A" font-weight="400">3</text><text x="879" y="694" font-family="DejaVu Sans" font-size="14" fill="#0F172A" font-weight="600">Explicar tu decisión</text><text x="838" y="764" font-family="DejaVu Sans" font-size="13" fill="#475569" font-weight="400">Al final podrás revisar tu</text><text x="838" y="784" font-family="DejaVu Sans" font-size="13" fill="#475569" font-weight="400">estrategia.</text><rect x="838" y="817" width="308" height="51" rx="12" fill="#1B4FD8" stroke="none"/><text x="856" y="849" font-family="DejaVu Sans" font-size="15" fill="#FFFFFF" font-weight="700">Revisar distribución</text><text x="816" y="927" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">Integración de habilidades. Mostrar</text><text x="816" y="949" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">criterios y correcciones antes del</text><text x="816" y="971" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">cierre final.</text><text x="1200" y="168" font-family="DejaVu Sans" font-size="20" fill="#0F172A" font-weight="700">✓ / Cierre común</text><rect x="1200" y="190" width="352" height="702" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/><text x="1222" y="226" font-family="DejaVu Sans" font-size="27" fill="#0F172A" font-weight="400">‹</text><text x="1248" y="224" font-family="DejaVu Sans" font-size="12" fill="#475569" font-weight="600">AHORRO · L05</text><text x="1509" y="224" font-family="DejaVu Sans" font-size="18" fill="#1B4FD8" font-weight="700">?</text><rect x="1222" y="244" width="308" height="5" rx="2" fill="#E2E8F0" stroke="none"/><rect x="1222" y="244" width="145" height="5" rx="2" fill="#10B981" stroke="none"/><text x="1222" y="275" font-family="DejaVu Sans" font-size="12" fill="#475569" font-weight="400">Actividad completada</text><text x="1222" y="313" font-family="DejaVu Sans" font-size="22" fill="#0F172A" font-weight="700">Ya tienes una meta con</text><text x="1222" y="342" font-family="DejaVu Sans" font-size="22" fill="#0F172A" font-weight="700">un plan</text><rect x="1222" y="410" width="308" height="148" rx="12" fill="#D1FAE5" stroke="none"/><text x="1240" y="448" font-family="DejaVu Sans" font-size="22" fill="#0F172A" font-weight="700">Mi computadora</text><text x="1240" y="489" font-family="DejaVu Sans" font-size="20" fill="#0F172A" font-weight="400">$6,000 en 6 meses</text><text x="1240" y="527" font-family="DejaVu Sans" font-size="17" fill="#0F172A" font-weight="600">$1,000 por mes</text><text x="1222" y="607" font-family="DejaVu Sans" font-size="15" fill="#0F172A" font-weight="400">Aprendiste a convertir un deseo</text><text x="1222" y="631" font-family="DejaVu Sans" font-size="15" fill="#0F172A" font-weight="400">en un monto y un plazo.</text><text x="1222" y="693" font-family="DejaVu Sans" font-size="14" fill="#065F46" font-weight="600">Guardado en este dispositivo</text><text x="1222" y="738" font-family="DejaVu Sans" font-size="15" fill="#1B4FD8" font-weight="600">Ver o ajustar mi meta</text><rect x="1222" y="817" width="308" height="51" rx="12" fill="#1B4FD8" stroke="none"/><text x="1240" y="849" font-family="DejaVu Sans" font-size="15" fill="#FFFFFF" font-weight="700">Volver a mi ruta</text><text x="1200" y="927" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">El resultado útil lidera el cierre.</text><text x="1200" y="949" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">El mensaje de guardado refleja el</text><text x="1200" y="971" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">estado real; XP es secundario.</text><text x="48" y="1047" font-family="DejaVu Sans" font-size="15" fill="#475569" font-weight="400">Estándar propuesto: contexto breve → actividad con identidad → consecuencia → aplicación → cierre.</text></svg>